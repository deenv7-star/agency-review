<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNA OS · המערכת הפרטית של DNA STUDIO</title>
<meta name="description" content="DNA OS - המערכת הפרטית שמחברת בין מה שקורה, מה DNA עושה ומה הצעד הבא.">
<link href="../assets/tel-aviv-fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#0b0d08;
  --panel:#12140d;
  --panel2:#171a10;
  --cream:#f3efe5;
  --cream-dim:rgba(243,239,229,.55);
  --cream-faint:rgba(243,239,229,.32);
  --acid:#dfff00;
  --acid-dim:rgba(223,255,0,.14);
  --line:rgba(243,239,229,.12);
  --f-display:"Tel Aviv Brutalist",Arial,sans-serif;
  --f-body:"Tel Aviv Modernist",Arial,sans-serif;
  --side-w:258px;
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--cream);
  font-family:var(--f-body);
  min-height:100svh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--acid);color:#0b0d08}
a{color:inherit;text-decoration:none}
button{font-family:var(--f-body);cursor:pointer;background:none;border:0;color:inherit}

/* ambient acid glow */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(640px 420px at 88% -8%, rgba(223,255,0,.075), transparent 65%),
    radial-gradient(900px 700px at -20% 110%, rgba(223,255,0,.045), transparent 60%);
}

/* ---------- sidebar ---------- */
.side{
  position:fixed;top:0;right:0;bottom:0;width:var(--side-w);z-index:20;
  display:flex;flex-direction:column;
  border-left:1px solid var(--line);
  background:rgba(11,13,8,.86);
  backdrop-filter:blur(14px);
  padding:26px 20px 20px;
}
.mark{display:flex;align-items:baseline;gap:7px;direction:ltr;font:900 22px var(--f-body);letter-spacing:.02em}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--acid);align-self:center}
.mark span{font:900 10px var(--f-body);letter-spacing:.22em;color:var(--acid);border:1px solid rgba(223,255,0,.4);border-radius:99px;padding:3px 8px 2px}
.client{margin:18px 2px 26px;font-size:12px;color:var(--cream-dim)}
.client b{display:block;font-size:15px;color:var(--cream);font-weight:700;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 13px;border-radius:14px;text-align:right;
  font-size:15px;font-weight:700;color:var(--cream-dim);
  transition:background .18s,color .18s;
}
.nav button .tag{margin-right:auto;direction:ltr;font:700 8.5px var(--f-body);letter-spacing:.14em;color:var(--cream-faint)}
.nav button:hover{background:rgba(243,239,229,.05);color:var(--cream)}
.nav button.active{background:var(--acid);color:#0b0d08}
.nav button.active .tag{color:rgba(11,13,8,.6)}
.nav button .ic{width:19px;height:19px;flex:none}
.nav button.active .ic{filter:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.mode-pill{font-size:11px;color:var(--cream-faint);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;line-height:1.5}
.mode-pill.demo{color:var(--acid);border-color:rgba(223,255,0,.35)}
.exit{font-size:12px;color:var(--cream-faint);text-align:right;padding:4px 3px}
.exit:hover{color:var(--cream)}

/* ---------- main ---------- */
.main{position:relative;z-index:1;margin-right:var(--side-w);padding:34px clamp(22px,3.4vw,52px) 90px;min-height:100svh}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:30px}
.kicker{display:inline-block;direction:ltr;font:700 10px var(--f-body);letter-spacing:.24em;color:var(--acid);margin-bottom:10px}
.top h1{font:900 clamp(30px,3.6vw,44px)/1 var(--f-display);letter-spacing:-.02em}
.top .date{font-size:12.5px;color:var(--cream-faint);white-space:nowrap}

.view{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- grids & cards ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.55fr 1fr}
.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px;
}
.card.pad-lg{padding:26px}
.card h3{font:900 19px var(--f-display);letter-spacing:-.01em}
.card .sub{font-size:12.5px;color:var(--cream-dim);margin-top:5px;line-height:1.55}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-head .tag{direction:ltr;font:700 9px var(--f-body);letter-spacing:.18em;color:var(--cream-faint)}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi .k-label{font-size:12.5px;color:var(--cream-dim)}
.kpi .k-num{font:900 40px/1.05 var(--f-display);letter-spacing:-.03em;margin:10px 0 8px;direction:ltr;text-align:right;white-space:nowrap}
.kpi .k-num small{font-size:17px;color:var(--cream-dim);font-weight:700}
.kpi .k-delta{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--acid);background:var(--acid-dim);border-radius:99px;padding:4px 10px}
.kpi .k-delta.flat{color:var(--cream-dim);background:rgba(243,239,229,.07)}
.kpi:after{content:"";position:absolute;top:-34px;left:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(223,255,0,.10),transparent 70%)}

/* pills & tags */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:99px;padding:4px 11px;border:1px solid var(--line);color:var(--cream-dim)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{color:var(--acid);border-color:rgba(223,255,0,.35);background:var(--acid-dim)}
.pill.off{color:var(--cream-faint)}
.pill.wait{color:#ffd66b;border-color:rgba(255,214,107,.3);background:rgba(255,214,107,.08)}
.plat{direction:ltr;font:700 9.5px var(--f-body);letter-spacing:.1em;color:var(--cream-dim);border:1px solid var(--line);border-radius:7px;padding:3px 7px}

/* bars */
.bar{height:7px;border-radius:99px;background:rgba(243,239,229,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acid)}
.bar-row{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:12px;font-size:12.5px;padding:9px 0}
.bar-row .v{direction:ltr;text-align:left;color:var(--cream-dim);font-weight:700}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;color:var(--cream-faint);font-weight:700;text-align:right;padding:0 10px 12px;border-bottom:1px solid var(--line)}
.tbl td{font-size:13.5px;padding:13px 10px;border-bottom:1px solid rgba(243,239,229,.07);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .name{font-weight:700}
.tbl .dim{color:var(--cream-dim);font-size:12px}
.tbl td.num{direction:ltr;text-align:left;font-weight:700}

/* campaign cards */
.camp{display:flex;flex-direction:column;gap:14px}
.camp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.camp h3{font-size:20px}
.camp-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.camp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.camp-stats .st{background:rgba(243,239,229,.045);border:1px solid rgba(243,239,229,.07);border-radius:14px;padding:11px 13px}
.camp-stats .st b{display:block;font:900 19px var(--f-display);direction:ltr;text-align:right}
.camp-stats .st span{font-size:11px;color:var(--cream-dim)}
.budget-line{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cream-dim);margin-bottom:7px}
.budget-line b{color:var(--cream);direction:ltr}

/* stepper (DNA WORK) */
.steps{display:flex;align-items:center;gap:0;margin:6px 0 2px;direction:rtl}
.steps .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:11px;color:var(--cream-faint)}
.steps .step:before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--cream-faint);background:var(--panel)}
.steps .step.done{color:var(--cream)}
.steps .step.done:before{background:var(--acid);border-color:var(--acid)}
.steps .step.now{color:var(--acid)}
.steps .step.now:before{border-color:var(--acid);box-shadow:0 0 0 5px rgba(223,255,0,.14)}
.steps .step:after{content:"";position:absolute;top:6px;right:calc(50% + 9px);width:calc(100% - 18px);height:2px;background:rgba(243,239,229,.12)}
.steps .step:last-child:after{display:none}
.steps .step.done:after{background:var(--acid)}
.work-item{display:flex;flex-direction:column;gap:13px}

/* NEXT MOVE */
.next-hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1a1e0d,#10120a 60%);
  border:1px solid rgba(223,255,0,.3);
}
.next-hero:before{content:"";position:absolute;top:-70px;left:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(223,255,0,.17),transparent 70%)}
.next-hero .kicker{margin-bottom:12px}
.next-hero h3{font:900 clamp(22px,2.6vw,30px)/1.15 var(--f-display);max-width:560px}
.next-hero p{margin-top:12px;font-size:14px;line-height:1.7;color:var(--cream-dim);max-width:520px}
.next-hero .why{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.why-chip{font-size:11px;color:var(--acid);background:var(--acid-dim);border:1px solid rgba(223,255,0,.25);border-radius:99px;padding:5px 12px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acid);color:#0b0d08;font-weight:900;font-size:13.5px;border-radius:99px;padding:12px 22px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--cream)}
.btn.done{background:rgba(243,239,229,.1);color:var(--acid);pointer-events:none}
.move{display:flex;flex-direction:column;gap:12px}
.move h3{font-size:18px}
.move p{font-size:13px;line-height:1.65;color:var(--cream-dim)}
.move .foot{display:flex;gap:9px;margin-top:auto;align-items:center}
.impact{font-size:11px;font-weight:700;color:var(--cream-dim)}
.impact b{color:var(--acid)}

/* learning */
.insight{display:flex;flex-direction:column;gap:11px}
.insight .q{font:900 18px/1.3 var(--f-display)}
.insight p{font-size:13px;line-height:1.7;color:var(--cream-dim)}
.insight .src{display:flex;gap:8px;align-items:center;margin-top:auto}

/* activity feed */
.feed{display:flex;flex-direction:column}
.feed .fi{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid rgba(243,239,229,.07);align-items:flex-start}
.feed .fi:last-child{border-bottom:0}
.feed .fi .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--acid);margin-top:6px}
.feed .fi .dot.dim{background:var(--cream-faint)}
.feed .fi p{font-size:13px;line-height:1.55}
.feed .fi time{font-size:11px;color:var(--cream-faint);display:block;margin-top:3px}

/* sparkline */
.spark{width:100%;height:150px;display:block}
.spark .area{fill:rgba(223,255,0,.09)}
.spark .line{fill:none;stroke:var(--acid);stroke-width:2.5;stroke-linecap:round}
.spark .dot{fill:var(--acid)}

/* empty states */
.empty{
  border:1.5px dashed rgba(243,239,229,.2);border-radius:var(--r-lg);
  padding:clamp(40px,6vw,70px) 26px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.empty .eic{width:56px;height:56px;border-radius:18px;background:var(--acid-dim);border:1px solid rgba(223,255,0,.25);display:grid;place-items:center}
.empty .eic svg{width:26px;height:26px;stroke:var(--acid)}
.empty h3{font:900 22px var(--f-display)}
.empty p{font-size:13.5px;color:var(--cream-dim);max-width:380px;line-height:1.7}
.welcome{display:flex;flex-direction:column;gap:20px}
.welcome ol{list-style:none;display:flex;flex-direction:column;gap:0;margin-top:6px}
.welcome li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(243,239,229,.07);font-size:13.5px;line-height:1.6;color:var(--cream-dim)}
.welcome li:last-child{border-bottom:0}
.welcome li b{color:var(--cream)}
.welcome li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acid);color:#0b0d08;font:900 13px/26px var(--f-body);text-align:center}

/* demo ribbon */
.demo-ribbon{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--acid);color:#0b0d08;
  font-size:12px;font-weight:900;text-align:center;padding:8px 14px;letter-spacing:.02em;
}
body.demo .demo-ribbon{display:block}
body.demo .main{padding-bottom:120px}

/* toast */
.toast{
  position:fixed;bottom:52px;left:50%;transform:translate(-50%,20px);z-index:60;
  background:var(--cream);color:#0b0d08;font-size:13px;font-weight:700;
  border-radius:14px;padding:13px 20px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:min(90vw,420px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* mobile tabbar */
.tabbar{display:none}
@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .g23,.g2{grid-template-columns:1fr}
}
@media(max-width:760px){
  .side{display:none}
  .main{margin-right:0;padding:22px 16px 150px}
  .top h1{font-size:29px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:rgba(11,13,8,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    gap:4px;
  }
  body.demo .tabbar{bottom:31px}
  .tabbar button{
    flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;color:var(--cream-faint);
    padding:7px 12px;border-radius:12px;white-space:nowrap;
  }
  .tabbar button.active{color:#0b0d08;background:var(--acid)}
  .tabbar button svg{width:18px;height:18px}
  .camp-stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="glow"></div>

<aside class="side">
  <a class="mark" href="#/overview" id="brandMark">DNA <span>OS</span><i></i></a>
  <div class="client" id="clientLabel"></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <div class="mode-pill" id="modePill"></div>
    <button class="exit" id="exitBtn">יציאה ←</button>
  </div>
</aside>

<main class="main">
  <header class="top">
    <div>
      <span class="kicker" id="viewTag"></span>
      <h1 id="viewTitle"></h1>
    </div>
    <span class="date" id="todayDate"></span>
  </header>
  <div id="viewRoot"></div>
</main>

<div class="demo-ribbon" id="demoRibbon">דמו להמחשה בלבד · הנתונים אינם נתוני לקוח אמיתי</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script src="brand.js"></script>
<script src="app.js"></script>
</body>
</html>
